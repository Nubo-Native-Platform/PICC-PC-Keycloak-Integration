<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
      .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .arrow-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #334155; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8fafc"/>
  <rect x="1" y="1" width="998" height="618" rx="15" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="45" class="title">Keycloak Integration Service - System Architecture</text>
  <text x="40" y="68" class="subtitle">Declarative IAM Abstraction, Token Interception, Realm &amp; User Provisioning Microservice</text>

  <!-- 1. Client Applications Layer -->
  <g transform="translate(40, 95)">
    <rect width="210" height="490" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="210" height="38" rx="12" fill="#f1f5f9"/>
    <rect y="26" width="210" height="12" fill="#f1f5f9"/>
    <text x="16" y="24" class="box-title">Client Consumers</text>

    <!-- Client Box 1 -->
    <g transform="translate(15, 55)">
      <rect width="180" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="12" y="12" width="70" height="20" rx="4" fill="#0284c7"/>
      <text x="47" y="26" text-anchor="middle" class="badge-text">REST API</text>
      <text x="12" y="50" class="box-title" font-size="13">Microservices Mesh</text>
      <text x="12" y="68" class="box-desc">Backend Services &amp; Daemons</text>
    </g>

    <!-- Client Box 2 -->
    <g transform="translate(15, 155)">
      <rect width="180" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="12" y="12" width="60" height="20" rx="4" fill="#10b981"/>
      <text x="42" y="26" text-anchor="middle" class="badge-text">Web UI</text>
      <text x="12" y="50" class="box-title" font-size="13">Management Portals</text>
      <text x="12" y="68" class="box-desc">Admin Consoles &amp; Dashboards</text>
    </g>

    <!-- Client Box 3 -->
    <g transform="translate(15, 255)">
      <rect width="180" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="12" y="12" width="55" height="20" rx="4" fill="#6366f1"/>
      <text x="39" y="26" text-anchor="middle" class="badge-text">CI/CD</text>
      <text x="12" y="50" class="box-title" font-size="13">Automation Pipelines</text>
      <text x="12" y="68" class="box-desc">Realm &amp; Client Provisioning</text>
    </g>

    <!-- Client Box 4 (OpenAPI) -->
    <g transform="translate(15, 355)">
      <rect width="180" height="105" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <rect x="12" y="12" width="75" height="20" rx="4" fill="#8b5cf6"/>
      <text x="49" y="26" text-anchor="middle" class="badge-text">Swagger UI</text>
      <text x="12" y="50" class="box-title" font-size="13">OpenAPI 3 Console</text>
      <text x="12" y="68" class="box-desc">/swagger-ui.html</text>
      <text x="12" y="86" class="box-desc">Interactive Test Harness</text>
    </g>
  </g>

  <!-- 2. Core Service Layer -->
  <g transform="translate(290, 95)">
    <rect width="380" height="490" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <rect width="380" height="38" rx="12" fill="#dcfce7"/>
    <rect y="26" width="380" height="12" fill="#dcfce7"/>
    <text x="16" y="24" class="box-title" fill="#15803d">Keycloak Integration Service (Spring Boot 3)</text>

    <!-- Controller Layer -->
    <g transform="translate(20, 55)">
      <rect width="340" height="90" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="16" y="25" class="box-title" fill="#166534">KeycloakIntegrationController</text>
      <text x="16" y="45" class="box-desc">• 30+ REST Endpoints for IAM Operations</text>
      <text x="16" y="62" class="box-desc">• Realms, Clients, Users, Roles, Groups, &amp; Tokens</text>
      <text x="16" y="79" class="box-desc">• Input Validation &amp; Log Injection Sanitization</text>
    </g>

    <!-- Service & Cache Layer -->
    <g transform="translate(20, 160)">
      <rect width="340" height="110" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="16" y="25" class="box-title" fill="#166534">KeycloakClientService &amp; CachingService</text>
      <text x="16" y="45" class="box-desc">• Automated Realm Replication &amp; Admin User Creation</text>
      <text x="16" y="62" class="box-desc">• ConcurrentMap Token Cache (@Cacheable)</text>
      <text x="16" y="79" class="box-desc">• Role Mapping &amp; Group Entitlement Orchestration</text>
      <text x="16" y="96" class="box-desc">• Error Decoding via KeycloakCustomErrorDecoder</text>
    </g>

    <!-- Interceptor & Token Engine -->
    <g transform="translate(20, 285)">
      <rect width="340" height="90" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="16" y="25" class="box-title" fill="#166534">KeycloakConfig RequestInterceptor</text>
      <text x="16" y="45" class="box-desc">• Automated JWT Interception &amp; Bearer Injection</text>
      <text x="16" y="62" class="box-desc">• Client Credentials Grant &amp; Refresh Token Logic</text>
      <text x="16" y="79" class="box-desc">• Expiration Decoding via java-jwt DecodedJWT</text>
    </g>

    <!-- Feign Declarative Clients -->
    <g transform="translate(20, 390)">
      <rect width="340" height="80" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="16" y="25" class="box-title" fill="#166534">Spring Cloud OpenFeign Clients</text>
      <text x="16" y="45" class="box-desc">• KeycloakAdminClient (Declarative Admin REST APIs)</text>
      <text x="16" y="62" class="box-desc">• KeycloakClient (OAuth2 Token Endpoint Client)</text>
    </g>
  </g>

  <!-- 3. Keycloak IAM Server & Storage -->
  <g transform="translate(710, 95)">
    <rect width="250" height="490" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <rect width="250" height="38" rx="12" fill="#dbeafe"/>
    <rect y="26" width="250" height="12" fill="#dbeafe"/>
    <text x="16" y="24" class="box-title" fill="#1d4ed8">Keycloak IAM &amp; Identity Store</text>

    <!-- Keycloak Master Realm -->
    <g transform="translate(15, 55)">
      <rect width="220" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
      <rect x="12" y="12" width="90" height="20" rx="4" fill="#2563eb"/>
      <text x="57" y="26" text-anchor="middle" class="badge-text">Admin Realm</text>
      <text x="12" y="50" class="box-title" font-size="13">Master Realm</text>
      <text x="12" y="68" class="box-desc">admin-cli Service Account</text>
      <text x="12" y="82" class="box-desc">Token Grant &amp; Token Refresh</text>
    </g>

    <!-- Keycloak Tenant Realms -->
    <g transform="translate(15, 160)">
      <rect width="220" height="110" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
      <rect x="12" y="12" width="95" height="20" rx="4" fill="#0284c7"/>
      <text x="59" y="26" text-anchor="middle" class="badge-text">Target Realms</text>
      <text x="12" y="50" class="box-title" font-size="13">Application Realms</text>
      <text x="12" y="68" class="box-desc">• Dedicated Realm per Tenant</text>
      <text x="12" y="84" class="box-desc">• Custom Themes &amp; Logins</text>
      <text x="12" y="100" class="box-desc">• Isolated Users, Roles &amp; Groups</text>
    </g>

    <!-- Database Storage -->
    <g transform="translate(15, 285)">
      <rect width="220" height="185" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
      <rect x="12" y="12" width="75" height="20" rx="4" fill="#3b82f6"/>
      <text x="49" y="26" text-anchor="middle" class="badge-text">Database</text>
      <text x="12" y="50" class="box-title" font-size="13">Keycloak Relational Store</text>
      <text x="12" y="70" class="box-desc">• PostgreSQL / MySQL / H2</text>
      <text x="12" y="88" class="box-desc">• User Credentials &amp; Hashes</text>
      <text x="12" y="106" class="box-desc">• Client Secrets &amp; Scopes</text>
      <text x="12" y="124" class="box-desc">• Group Hierarchies</text>
      <text x="12" y="142" class="box-desc">• Role Mappings</text>
      <text x="12" y="160" class="box-desc">• Active Sessions</text>
    </g>
  </g>

  <!-- Connectors -->
  <!-- Clients to Service -->
  <line x1="250" y1="200" x2="290" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="190" text-anchor="middle" class="arrow-text">REST</text>

  <line x1="250" y1="300" x2="290" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="290" text-anchor="middle" class="arrow-text">JSON</text>

  <!-- Service to Keycloak -->
  <line x1="670" y1="200" x2="710" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="690" y="190" text-anchor="middle" class="arrow-text" fill="#2563eb">Feign</text>

  <line x1="670" y1="430" x2="710" y2="430" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="690" y="420" text-anchor="middle" class="arrow-text" fill="#2563eb">HTTP</text>
</svg>
